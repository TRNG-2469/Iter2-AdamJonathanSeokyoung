<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reimbursements</title>
    <script type="module" src="./js/reimbursementPage/dashboard.js" defer></script>
    <link rel="stylesheet" href="./css/reimbursementsstyles.css">
</head>
    <body>

    <h1>Employee Reimbursement System</h1>

    <p>
        Logged in as:
        <strong id="username"></strong>
        (<span id="role"></span>)
    </p>

    <hr>

    <h2>Reimbursements</h2>

    <form id="filterForm">
        <label for="status">Status:</label>

        <select id="status">
            <option value="">All</option>
            <option value="PENDING">Pending</option>
            <option value="APPROVED">Approved</option>
            <option value="DENIED">Denied</option>
        </select>

        <span id="departmentFilter" hidden>
            <label for="department">Department:</label>

            <select id="department">
                <option value="">All</option>
                <option value="1">Department 1</option>
                <option value="2">Department 2</option>
                <option value="3">Department 3</option>\
                <option value="4">Department 4</option>
                <option value="5">Department 5</option>

            </select>
        </span>

        <button type="submit">Filter</button>
    </form>

    <button id="createReimbursementButton">Create Reimbursement</button>
    <form id="createReimbursementForm" hidden>
        <div class="entry">
            <label for="amount">Amount:</label>
            <input type="number" id="amount" name="amount" step="0.01" min="0.01" max="999999" required>
        </div>

        <div class="entry">
            <label for="type">Type:</label>
            <select id="type" name="type" required>
                <option value="TRAVEL">Travel</option>
                <option value="FOOD">Food</option>
                <option value="LODGING">Lodging</option>
                <option value="MEDICAL">Medical</option>
                <option value="TRANSPORTATION">Transportation</option>
                <option value="OTHER">Other</option>
            </select>
        </div>

        <div class="entry">
            <label for="description">Description:</label>
            <textarea id="description" name="description" maxlength="255"></textarea>
        </div>

        <div class="entry">
            <button type="submit">Submit</button>
            <button type="button" id="cancelCreateReimbursement">Cancel</button>
        </div>
    </form>

    <button id="historyButton" hidden>Reimbursement History</button>

    <ul id="reimbursements"></ul>

    <p id="error"></p>

    <button id="logout">Logout</button>

    </body>
</html>
